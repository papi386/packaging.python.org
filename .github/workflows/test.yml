name: Test

on:
  merge_group:
  push:
    branches-ignore:
    - gh-readonly-queue/**  # Temporary merge queue-related GH-made branches
  pull_request:
    types:
    - opened  # default
    - synchronize  # default
    - reopened  # default
    - ready_for_review  # used in PRs created from GitHub Actions workflows
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  linkcheck-baseline:
    if: contains(fromJSON('["pull_request", "merge_group"]'), github.event_name)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      # Use the event's immutable base revision, not the candidate or moving main.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade nox virtualenv

      # Ignored links still appear in Sphinx's JSONL. Collect a fresh inventory
      # without depending on the health of old URLs. Any build error is fatal.
      - name: Collect baseline links
        run: python -m nox -s linkcheck -- -E -D 'linkcheck_ignore=.*'

      - name: Upload completed baseline
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linkcheck-baseline-${{ github.run_attempt }}
          path: build/output.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: ${{ matrix.noxenv }}
    if: github.repository_owner == 'pypa' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        noxenv:
        - build
        - linkcheck_tests

    # Share runner steps without making these independent checks wait for links.
    steps:
      - &candidate-checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - &candidate-python
        name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - &candidate-dependencies
        name: Install dependencies
        run: |
          python -m pip install --upgrade nox virtualenv

      - &candidate-nox
        name: Nox ${{ matrix.noxenv }}
        env:
          # Authenticate github.com requests during linkcheck to avoid rate limits.
          GITHUB_TOKEN: ${{ matrix.noxenv == 'linkcheck' && github.token || '' }}
          LINKCHECK_BASELINE: >-
            ${{ matrix.noxenv == 'linkcheck' &&
              contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) &&
              format('{0}/linkcheck-baseline/output.json', runner.temp) || '' }}
        run: |
          python -m nox -s ${{ matrix.noxenv }}

  linkcheck:
    name: ${{ matrix.noxenv }}
    needs: linkcheck-baseline
    if: >-
      ${{ !cancelled() &&
        contains(fromJSON('["success", "skipped"]'), needs.linkcheck-baseline.result) &&
        (github.repository_owner == 'pypa' || github.event_name != 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Preserve full, non-blocking audits on non-default-branch pushes.
    continue-on-error: >-
      ${{ github.event_name == 'push' && github.ref_name != github.event.repository.default_branch }}
    strategy:
      matrix:
        noxenv:
        - linkcheck
    steps:
      - *candidate-checkout
      - *candidate-python
      - *candidate-dependencies

      # An empty artifact-ids input would download every artifact in the run.
      - name: Require a baseline artifact ID
        if: >-
          matrix.noxenv == 'linkcheck' &&
          contains(fromJSON('["pull_request", "merge_group"]'), github.event_name)
        env:
          BASELINE_ARTIFACT_ID: ${{ needs.linkcheck-baseline.outputs.artifact-id }}
        shell: python
        run: |
          import os
          import re
          if not re.fullmatch(r"[1-9][0-9]*", os.environ["BASELINE_ARTIFACT_ID"]):
              raise SystemExit("Missing or invalid baseline artifact ID")

      - name: Download baseline from this run
        if: >-
          matrix.noxenv == 'linkcheck' &&
          contains(fromJSON('["pull_request", "merge_group"]'), github.event_name)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.linkcheck-baseline.outputs.artifact-id }}
          path: ${{ runner.temp }}/linkcheck-baseline
          merge-multiple: true
          digest-mismatch: error

      - *candidate-nox


  check:
    # This job does nothing and is only used for the branch protection
    # or multi-stage CI jobs, like making sure that all tests pass before
    # a publishing job is started.
    if: always()

    needs:
    - build
    - linkcheck
    - linkcheck-baseline

    runs-on: ubuntu-latest

    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
      with:
        allowed-skips: >-
          ${{ !contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && 'linkcheck-baseline' || '' }}
        jobs: ${{ toJSON(needs) }}
